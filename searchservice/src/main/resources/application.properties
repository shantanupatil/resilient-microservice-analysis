spring.application.name=searchservice
spring.datasource.url=jdbc:postgresql://localhost:5432/places
spring.datasource.username=research
spring.datasource.password=researchUserPassword
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=5741

#Profile
spring.profiles.active=circuit-breaker

#Prometheus
management.metrics.tags.application=searchservice
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

#Resilience4j
resilience4j.retry.instances.searchRetry.max-attempts=3
resilience4j.retry.instances.searchRetry.wait-duration=200ms
resilience4j.retry.instances.searchRetry.enable-exponential-backoff=true
resilience4j.retry.instances.searchRetry.exponential-backoff-multiplier=2
resilience4j.retry.instances.searchRetry.enable-randomized-wait=true
resilience4j.retry.instances.searchRetry.randomized-wait-factor=0.5
resilience4j.timelimiter.instances.searchTimeout.timeout-duration=1s
resilience4j.timelimiter.instances.searchTimeout.cancel-running-future=true

resilience4j.thread-pool-bulkhead.instances.searchBulkhead.core-thread-pool-size=10
resilience4j.thread-pool-bulkhead.instances.searchBulkhead.max-thread-pool-size=10
resilience4j.thread-pool-bulkhead.instances.searchBulkhead.queue-capacity=20

resilience4j.thread-pool-bulkhead.instances.fullTextSearchBulkhead.core-thread-pool-size=10
resilience4j.thread-pool-bulkhead.instances.fullTextSearchBulkhead.max-thread-pool-size=10
resilience4j.thread-pool-bulkhead.instances.fullTextSearchBulkhead.queue-capacity=20

resilience4j.circuitbreaker.instances.searchCircuitBreaker.sliding-window-size=20
resilience4j.circuitbreaker.instances.searchCircuitBreaker.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.searchCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.searchCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.searchCircuitBreaker.permitted-number-of-calls-in-half-open-state=3

logging.level.io.github.resilience4j.retry=DEBUG
logging.level.io.github.resilience4j.circuitbreaker=DEBUG